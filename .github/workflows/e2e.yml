name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cada merge na main é validado: um run novo não cancela o anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  static-analysis:
    name: Lint, Typecheck & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: TypeScript
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check

  e2e:
    name: Playwright E2E
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # O projeto roda no canal `chrome` (Google Chrome), não no Chromium do Playwright.
      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome

      # Histórico do Allure: restaura o arquivo do último run para montar as tendências.
      - name: Restore Allure history
        uses: actions/cache@v6
        with:
          path: allure-history.jsonl
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Run tests
        run: npm test

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate ./allure-results

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      # Traces, screenshots e vídeos só existem quando há falha.
      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
